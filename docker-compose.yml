version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: change-impact-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  intelligence-service:
    build:
      context: ./intelligence_service
      dockerfile: Dockerfile
    container_name: change-impact-intelligence
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/change_impact_engine
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy

  backend-gateway:
    build:
      context: ./backend_gateway
      dockerfile: Dockerfile
    container_name: change-impact-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/change_impact_engine
      - INTELLIGENCE_SERVICE_URL=http://intelligence-service:8000
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - intelligence-service

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: change-impact-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-gateway

volumes:
  mongo_data:
